<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Fugini</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .header {
      background: #D2001B;
      color: white;
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .header p  { font-size: 13px; opacity: 0.85; margin-top: 4px; }
    .card {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-title {
      background: #fafafa;
      border-bottom: 1px solid #eee;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      text-decoration: none;
      color: #222;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }
    .btn:last-child { border-bottom: none; }
    .btn:hover { background: #fef5f5; }
    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #D2001B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .btn-text strong { display: block; font-size: 15px; font-weight: 600; }
    .btn-text span   { font-size: 12px; color: #888; }
    .footer {
      margin-top: 8px;
      font-size: 11px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>FUGINI ALIMENTOS</h1>
    <p>Painel do Vendedor — São Carlos</p>
  </div>

  <div class="card">
    <div class="card-title">Ferramentas</div>
    <a class="btn" href="master_sc.html#fugini@master_sc">
      <div class="btn-icon">🗺️</div>
      <div class="btn-text">
        <strong>Mapa de Clientes (Master)</strong>
        <span>Visão completa da região</span>
      </div>
    </a>
    <a class="btn" href="vendedor_sc.html#fugini@sc1">
      <div class="btn-icon">🗺️</div>
      <div class="btn-text">
        <strong>Mapa de Clientes (Vendedor)</strong>
        <span>Visualizar clientes na região</span>
      </div>
    </a>
    <a class="btn" href="checkin.html">
      <div class="btn-icon">📍</div>
      <div class="btn-text">
        <strong>Check-in de Visita</strong>
        <span>Registrar visita a cliente</span>
      </div>
    </a>
    <a class="btn" href="agenda.html">
      <div class="btn-icon">📅</div>
      <div class="btn-text">
        <strong>Agenda</strong>
        <span>Visitas planejadas e realizadas</span>
      </div>
    </a>
  </div>

  <div class="footer">Fugini Alimentos · uso interno</div>

</body>
</html>
