<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda Fugini</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }

    /* HEADER */
    .header {
      background: #1a1a2e;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .header-logo span { color: #D2001B; }
    .header-vendedor { font-size: 12px; color: #aaa; }

    /* TABS */
    .tabs {
      background: #1a1a2e;
      display: flex;
      border-top: 1px solid #333;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      color: #aaa;
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    .tab.active { color: white; border-bottom: 2px solid #D2001B; }

    /* CONTEÚDO */
    .content { padding: 16px; max-width: 480px; margin: 0 auto; }

    /* STATS */
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 700; color: #222; }
    .stat-value.green { color: #27ae60; }
    .stat-value.orange { color: #e67e22; }

    /* CALENDÁRIO */
    .calendario {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 16px;
      margin-bottom: 16px;
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-header button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #555;
      padding: 4px 8px;
    }
    .cal-mes { font-size: 13px; font-weight: 700; color: #333; letter-spacing: 1px; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: #aaa;
      padding: 4px 0;
      text-transform: uppercase;
    }
    .cal-dia {
      text-align: center;
      padding: 6px 2px 4px;
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.15s;
    }
    .cal-dia:hover { background: #f5f5f5; }
    .cal-dia.hoje { background: #D2001B; color: white; }
    .cal-dia.hoje .cal-dia-num { color: white; }
    .cal-dia.selecionado { background: #fdecea; }
    .cal-dia.outro-mes { opacity: 0.3; pointer-events: none; }
    .cal-dia-num { font-size: 13px; font-weight: 500; }
    .cal-dots { display: flex; gap: 2px; margin-top: 2px; flex-wrap: wrap; justify-content: center; }
    .cal-dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
    .dot-pendente  { background: #e67e22; }
    .dot-realizada { background: #27ae60; }
    .dot-ausente   { background: #e74c3c; }
    .dot-reagendada { background: #3498db; }
    .dot-checkin   { background: #9b59b6; }

    /* LISTA DO DIA */
    .lista-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .lista-titulo { font-size: 16px; font-weight: 700; color: #222; }
    .lista-count  { font-size: 12px; color: #888; }

    .btn-nova {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #D2001B;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      width: 100%;
      justify-content: center;
    }

    /* CARDS */
    .card {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .card-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-top: 2px;
    }
    .icon-pendente   { background: #fef3e8; }
    .icon-realizada  { background: #eafaf1; }
    .icon-ausente    { background: #fdecea; }
    .icon-reagendada { background: #ebf5fb; }
    .icon-checkin    { background: #f5eef8; }
    .card-body { flex: 1; }
    .card-nome { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 3px; }
    .card-meta { font-size: 12px; color: #888; margin-bottom: 6px; }
    .card-status {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .status-pendente   { background: #fef3e8; color: #e67e22; }
    .status-realizada  { background: #eafaf1; color: #27ae60; }
    .status-ausente    { background: #fdecea; color: #e74c3c; }
    .status-reagendada { background: #ebf5fb; color: #3498db; }
    .status-checkin    { background: #f5eef8; color: #9b59b6; }
    .card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn-checkin {
      background: #D2001B; color: white; border: none;
      border-radius: 6px; padding: 6px 12px; font-size: 12px;
      font-weight: 600; cursor: pointer; text-decoration: none;
      display: inline-block;
    }

    /* MODAL NOVO AGENDAMENTO */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .overlay.aberto { display: flex; }
    .modal {
      background: white;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px;
      width: 100%;
      max-width: 480px;
    }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .modal label { font-size: 13px; color: #555; display: block; margin-top: 12px; margin-bottom: 4px; }
    .modal input, .modal select {
      width: 100%; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; font-family: 'Segoe UI', sans-serif;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancelar {
      flex: 1; padding: 12px; background: #f5f5f5; color: #555;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .btn-salvar {
      flex: 2; padding: 12px; background: #D2001B; color: white;
      border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }

    .vazio { text-align: center; color: #bbb; font-size: 13px; padding: 32px 0; }
    .loading { text-align: center; color: #aaa; font-size: 13px; padding: 24px 0; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">FUGINI<span>.</span>CRM</div>
  <div class="header-vendedor" id="header-vendedor">—</div>
</div>
<div class="tabs">
  <a href="painel.html" class="tab">🗺️ Mapa</a>
  <a href="agenda.html" class="tab active">📅 Agenda</a>
</div>

<div class="content">
  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <span class="stat-label">Visitas</span>
      <span class="stat-value" id="stat-total">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Concluídas</span>
      <span class="stat-value green" id="stat-concluidas">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Pendentes</span>
      <span class="stat-value orange" id="stat-pendentes">—</span>
    </div>
  </div>

  <!-- Calendário -->
  <div class="calendario">
    <div class="cal-header">
      <button onclick="mudarMes(-1)">‹</button>
      <div class="cal-mes" id="cal-mes-titulo"></div>
      <button onclick="mudarMes(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- Lista do dia -->
  <div class="lista-header">
    <div class="lista-titulo" id="lista-titulo">Hoje</div>
    <div class="lista-count" id="lista-count"></div>
  </div>
  <button class="btn-nova" onclick="abrirModal()">+ Nova Visita</button>
  <div id="lista-visitas"><div class="loading">Carregando...</div></div>
</div>

<!-- Modal novo agendamento -->
<div class="overlay" id="overlay" onclick="fecharModalFora(event)">
  <div class="modal">
    <h3>Nova Visita</h3>
    <label>Cód. Cliente</label>
    <input type="text" id="modal-cod" placeholder="Ex: 00001"/>
    <label>Nome Cliente</label>
    <input type="text" id="modal-nome" placeholder="Ex: Mercado Silva Ltda"/>
    <label>Data</label>
    <input type="date" id="modal-data"/>
    <label>Hora (opcional)</label>
    <input type="time" id="modal-hora"/>
    <label>Observação (opcional)</label>
    <input type="text" id="modal-obs" placeholder="Ex: Levar tabela de preços"/>
    <div class="modal-actions">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarAgendamento()">Salvar</button>
    </div>
  </div>
</div>

<script>
  const API = 'https://fugini-checkin-api.vercel.app/api';
  const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO',
                 'JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  const DIAS_SEMANA = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const STATUS_ICON = {
    pendente: '🕐', realizada: '✅', ausente: '❌', reagendada: '🔁', checkin: '📍'
  };

  let codVendedor = localStorage.getItem('cod_vendedor') || '';
  let agendamentos = [];
  let diaSelecionado = new Date().toISOString().split('T')[0];
  let mesAtual = new Date();

  // Pede código do vendedor se não tiver
  if (!codVendedor) {
    codVendedor = prompt('Digite seu código de vendedor:') || '';
    if (codVendedor) localStorage.setItem('cod_vendedor', codVendedor);
  }
  document.getElementById('header-vendedor').textContent = codVendedor ? `Vendedor: ${codVendedor}` : '';

  // ── Carrega agendamentos do mês ──────────────────────────────────────────
  async function carregarMes() {
    const mes = `${mesAtual.getFullYear()}-${String(mesAtual.getMonth()+1).padStart(2,'0')}`;
    const res = await fetch(`${API}/agendamentos?cod_vendedor=${codVendedor}&mes=${mes}`);
    agendamentos = await res.json();
    renderCalendario();
    renderLista();
    atualizarStats();
  }

  // ── Stats ────────────────────────────────────────────────────────────────
  function atualizarStats() {
    const total      = agendamentos.length;
    const concluidas = agendamentos.filter(a => a.status === 'realizada').length;
    const pendentes  = agendamentos.filter(a => a.status === 'pendente').length;
    document.getElementById('stat-total').textContent      = total;
    document.getElementById('stat-concluidas').textContent = concluidas;
    document.getElementById('stat-pendentes').textContent  = pendentes;
  }

  // ── Calendário ───────────────────────────────────────────────────────────
  function renderCalendario() {
    const ano = mesAtual.getFullYear();
    const mes = mesAtual.getMonth();
    document.getElementById('cal-mes-titulo').textContent = `${MESES[mes]} ${ano}`;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    // Cabeçalho dias da semana
    DIAS_SEMANA.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const primeiroDia = new Date(ano, mes, 1).getDay();
    const ultimoDia   = new Date(ano, mes+1, 0).getDate();
    const hoje        = new Date().toISOString().split('T')[0];

    // Dias do mês anterior (vazios)
    for (let i = 0; i < primeiroDia; i++) {
      const el = document.createElement('div');
      el.className = 'cal-dia outro-mes';
      grid.appendChild(el);
    }

    // Dias do mês
    for (let d = 1; d <= ultimoDia; d++) {
      const dataStr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const visitas = agendamentos.filter(a => a.data_visita === dataStr);

      const el = document.createElement('div');
      el.className = 'cal-dia';
      if (dataStr === hoje) el.classList.add('hoje');
      if (dataStr === diaSelecionado && dataStr !== hoje) el.classList.add('selecionado');

      el.innerHTML = `<span class="cal-dia-num">${d}</span>`;

      if (visitas.length > 0) {
        const dots = document.createElement('div');
        dots.className = 'cal-dots';
        visitas.slice(0,3).forEach(v => {
          const dot = document.createElement('span');
          dot.className = `cal-dot dot-${v.status}`;
          dots.appendChild(dot);
        });
        el.appendChild(dots);
      }

      el.onclick = () => selecionarDia(dataStr);
      grid.appendChild(el);
    }
  }

  function selecionarDia(dataStr) {
    diaSelecionado = dataStr;
    renderCalendario();
    renderLista();
  }

  function mudarMes(delta) {
    mesAtual.setMonth(mesAtual.getMonth() + delta);
    carregarMes();
  }

  // ── Lista do dia ─────────────────────────────────────────────────────────
  function renderLista() {
    const visitas = agendamentos.filter(a => a.data_visita === diaSelecionado);
    const [ano, mes, dia] = diaSelecionado.split('-');
    document.getElementById('lista-titulo').textContent =
      `${parseInt(dia)} de ${MESES[parseInt(mes)-1].charAt(0) + MESES[parseInt(mes)-1].slice(1).toLowerCase()}`;
    document.getElementById('lista-count').textContent =
      visitas.length > 0 ? `${visitas.length} visita${visitas.length > 1 ? 's' : ''}` : '';

    const container = document.getElementById('lista-visitas');
    if (visitas.length === 0) {
      container.innerHTML = '<div class="vazio">Nenhuma visita neste dia</div>';
      return;
    }

    container.innerHTML = visitas.map(v => {
      const hora = v.hora_visita ? v.hora_visita.substring(0,5) : '';
      const icon = STATUS_ICON[v.status] || '🕐';
      const isPendente = v.status === 'pendente';
      const nomeEncoded = encodeURIComponent(v.nome_cliente);
      return `
        <div class="card">
          <div class="card-icon icon-${v.status}">${icon}</div>
          <div class="card-body">
            <div class="card-nome">${v.nome_cliente}</div>
            <div class="card-meta">
              ${hora ? `🕐 ${hora} · ` : ''}Cód: ${v.cod_cliente}
              ${v.observacao ? `<br>${v.observacao}` : ''}
            </div>
            <span class="card-status status-${v.status}">
              ${v.status.charAt(0).toUpperCase() + v.status.slice(1)}
            </span>
            ${isPendente ? `
              <div class="card-actions">
                <a class="btn-checkin"
                   href="checkin.html?cod_cliente=${v.cod_cliente}&nome_cliente=${nomeEncoded}&agendamento_id=${v.id}">
                  📍 Check-in
                </a>
              </div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  // ── Modal novo agendamento ────────────────────────────────────────────────
  function abrirModal() {
    document.getElementById('modal-data').value = diaSelecionado;
    document.getElementById('overlay').classList.add('aberto');
  }
  function fecharModal() {
    document.getElementById('overlay').classList.remove('aberto');
  }
  function fecharModalFora(e) {
    if (e.target === document.getElementById('overlay')) fecharModal();
  }

  async function salvarAgendamento() {
    const cod       = document.getElementById('modal-cod').value.trim();
    const nome      = document.getElementById('modal-nome').value.trim();
    const data      = document.getElementById('modal-data').value;
    const hora      = document.getElementById('modal-hora').value;
    const obs       = document.getElementById('modal-obs').value.trim();

    if (!cod || !nome || !data) {
      alert('Preencha Cód. Cliente, Nome e Data.');
      return;
    }

    const res = await fetch(`${API}/agendamentos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cod_cliente: cod, nome_cliente: nome,
        cod_vendedor: codVendedor,
        data_visita: data, hora_visita: hora || null,
        observacao: obs || null
      })
    });

    if (res.ok) {
      fecharModal();
      document.getElementById('modal-cod').value  = '';
      document.getElementById('modal-nome').value = '';
      document.getElementById('modal-hora').value = '';
      document.getElementById('modal-obs').value  = '';
      await carregarMes();
    } else {
      alert('Erro ao salvar. Tente novamente.');
    }
  }

  // Inicia
  carregarMes();
</script>
</body>
</html>
